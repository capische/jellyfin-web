<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0}</style>
<title>JellyfinMod Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Bebas+Neue&family=Playfair+Display:wght@700&display=swap">

<style>
/* ============================================================
   JellyfinMod — the settled design, clickable.
   Rule 0  nothing upstream is removed
   Rule 1  one entry per title; Movies IS the list
   Rule 2  search = what you have + leftovers from TMDB
   Rule 3  file state is one icon over the cover
   Rule 4  no chip row — a File group inside Filter
   Rule 5  history is one collapsed line
   Rule 6  Home merges Continue+NextUp and Latest Movies+Shows
   Palette/type from themes/_base: #101010 #202020 #00a4dc, Noto Sans
   ============================================================ */
:root{
  --bg:#101010; --paper:#202020; --paper2:#2b2b2b; --line:#333;
  --ink:#fff; --ink2:#b9b9b9; --ink3:#828282;
  --jf:#00a4dc; --err:#c62828; --star:#f2b01e; --mod:#aa5cc3;
  --f:'Noto Sans',system-ui,-apple-system,sans-serif;
  --m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0a0a0a;color:var(--ink);font-family:var(--f);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--jf);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- stage / device ---------- */
#stage{position:fixed;inset:0;display:grid;place-items:center;padding:0;
  background:radial-gradient(1000px 600px at 50% -20%,#17171a,#0a0a0a 70%)}
body.m-desktop #stage{display:block;padding:0}
body.m-tablet #stage,body.m-mobile #stage,body.m-tv #stage{padding:22px 22px 86px}
#frame{position:relative}
body.m-desktop #frame{width:100%;height:100%}
#screen{position:absolute;top:0;left:0;overflow:hidden;background:var(--bg);transform-origin:top left;
  display:flex;flex-direction:column;font-size:16px;max-width:100%}
body.m-desktop #screen{position:relative;width:100%;height:100%}
body.m-tablet #screen{width:1024px;height:768px;font-size:14.4px;border-radius:12px;
  box-shadow:0 30px 70px -26px #000,0 0 0 8px #000}
body.m-mobile #screen{width:390px;height:844px;font-size:14.4px;border-radius:28px;
  box-shadow:0 30px 70px -26px #000,0 0 0 9px #000}
body.m-tv #screen{width:1920px;height:1080px;font-size:20px;border-radius:6px;
  box-shadow:0 40px 90px -30px #000,0 0 0 9px #000}
#screen::after{content:attr(data-mode);position:absolute;left:0;right:0;bottom:0;text-align:center;
  font-family:var(--m);font-size:9px;letter-spacing:.14em;color:#5a5a5a;padding:16px 0 5px;
  background:linear-gradient(transparent,var(--bg) 70%);pointer-events:none;z-index:80}
body.m-desktop #screen::after{display:none}

/* ---------- app bar ---------- */
.tb{display:flex;align-items:center;gap:.15em;padding:.4em 1.6em;min-height:3.4em;flex:none;
  position:absolute;top:0;left:0;right:0;z-index:60;
  background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.36) 55%,transparent 100%);
  transition:background .28s ease}
body.scrolled .tb{background:var(--bg);box-shadow:0 1px 0 rgba(255,255,255,.06)}
body.m-mobile .tb{padding:.4em .8em}
.logo{display:inline-flex;align-items:center;gap:.55em;padding:.2em .3em;border-radius:.25em;flex:none}
.logo .mk2{width:1.75em;height:1.75em;flex:none;display:block}
.logo b{font-size:1.02em;font-weight:700;color:var(--ink);letter-spacing:.01em}
body.m-mobile .logo b{display:none}
.ic{width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.ic:hover{background:#ffffff14;color:var(--ink)}
.ic svg{width:1.3em;height:1.3em;display:block}
.srv{display:inline-flex;align-items:center;gap:.45em;padding:.35em .55em;border-radius:.25em;
  font-size:.85em;color:var(--ink2);font-weight:500;white-space:nowrap}
.srv .d{width:.5em;height:.5em;border-radius:50%;background:var(--jf)}
.nav{display:flex;align-items:center;gap:.1em;min-width:0}
.nav{gap:.15em;margin-left:.9em}
.nav .nb{padding:.45em .7em;border-radius:.2em;font-size:.88em;color:var(--ink);
  display:inline-flex;align-items:center;gap:.5em;white-space:nowrap;font-weight:400;transition:color .15s}
.nav .nb svg{width:1.25em;height:1.25em;opacity:.92}
.nav .nb.on{color:var(--jf)}
.nav .nb.on svg{opacity:1}
.nav .nb:hover{background:#ffffff0f}


.grow{flex:1}
.avwrap{position:relative;flex:none;margin-left:.3em}
.av{width:2.1em;height:2.1em;border-radius:50%;background:var(--jf);display:grid;place-items:center;
  color:#fff}
.av svg{width:1.4em;height:1.4em}
.umenu{position:absolute;right:0;top:2.8em;min-width:14.5em;background:#2a2a2a;
  border-radius:.15em;padding:.4em 0;box-shadow:0 1em 2.4em -.5em rgba(0,0,0,.85);z-index:70}
.umenu button{display:flex;align-items:center;gap:1em;width:100%;padding:.6em 1.2em;
  font-size:.92em;color:var(--ink);text-align:left;white-space:nowrap}
.umenu button:hover{background:#ffffff12}
.umenu button svg{width:1.25em;height:1.25em;color:var(--ink2);flex:none}
.umenu .sep2{height:1px;background:#3d3d3d;margin:.4em 0}
.umenu button.mod svg{color:var(--mod)}

/* ---------- tabs ---------- */
.tabs{background:var(--bg);display:flex;gap:0;padding:0 1.6em;overflow-x:auto;
  scrollbar-width:none;flex:none;position:relative;z-index:25}
body.m-mobile .tabs{padding:0 .8em}
.tabs::-webkit-scrollbar{display:none}
.tabs.tv{justify-content:center}
.tabs.tv .in{width:50%;display:flex;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.tabs.tv .in::-webkit-scrollbar{display:none}
.tab{padding:.7em .85em .55em;font-size:.83em;color:var(--ink3);white-space:nowrap;
  border-bottom:.14em solid transparent;font-weight:500}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--ink);border-bottom-color:var(--jf)}

/* ---------- library toolbar ---------- */
.ltb{display:flex;align-items:center;gap:.4em;padding:.75em .95em .4em;flex:none;position:relative;z-index:20}
.cnt{font-family:var(--m);font-size:.72em;color:var(--ink3);font-variant-numeric:tabular-nums}
.tb2{padding:.35em .6em;border-radius:.25em;color:var(--ink2);font-size:.78em;
  display:inline-flex;align-items:center;gap:.35em;white-space:nowrap}
.tb2:hover{background:#ffffff0f;color:var(--ink)}
.tb2 svg{width:.95em;height:.95em}
.tb2.act{background:#ffffff17;color:var(--ink)}
.tb2.hasf{color:#e2c3ee}
.tb2 .fn{font-family:var(--m);font-size:.85em;background:var(--mod);color:#fff;
  border-radius:1em;padding:0 .4em;min-width:1.25em;text-align:center}

/* ---------- filter menu ---------- */
.menu{position:absolute;z-index:200;min-width:14em;background:var(--paper2);
  border:1px solid var(--line);border-radius:.3em;padding:.3em;
  box-shadow:0 1.2em 2.6em -.6em rgba(0,0,0,.85)}
.mh{font-family:var(--m);font-size:.66em;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);padding:.7em .75em .3em}
.mi{display:flex;align-items:center;gap:.6em;width:100%;padding:.42em .75em;border-radius:.2em;
  font-size:.84em;color:var(--ink2);text-align:left;white-space:nowrap}
.mi:hover{background:#ffffff0f;color:var(--ink)}
.mi .bx{width:1.05em;height:1.05em;border-radius:.15em;border:1.5px solid #5a5a5a;flex:none;
  display:grid;place-items:center}
.mi .bx svg{width:.8em;height:.8em;opacity:0;color:#fff}
.mi.on{color:var(--ink)}
.mi.on .bx{background:var(--mod);border-color:var(--mod)}
.mi.on .bx svg{opacity:1}
.msep{height:1px;background:var(--line);margin:.35em .2em}
.mi.plain .bx{display:none}
.mi.plain{gap:.9em;padding:.5em .95em}
.mi.plain svg{width:1.15em;height:1.15em;flex:none;opacity:.85;color:var(--ink2)}
.mi.modItem{color:#e0bced}
.mi.modItem svg{color:var(--mod);opacity:1}
.mi.modItem:hover{background:rgba(170,92,195,.16)}

/* ---------- body / grid ---------- */
.body{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;position:relative;width:100%}
.pad-top{height:3.9em;flex:none}
.body::-webkit-scrollbar{width:.5em}
.body::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:1em}
.grid{display:grid;gap:1.15em .7em;padding:.3em .95em 4em}
body.m-desktop .grid{grid-template-columns:repeat(auto-fill,minmax(9.4em,1fr))}
body.m-tablet .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
body.m-mobile .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
body.m-tv .grid{grid-template-columns:repeat(7,minmax(0,1fr));padding-top:1.6em;margin-top:-1.3em}

.card{position:relative;display:block;width:100%;min-width:0;text-align:left;padding:0}
.poster{position:relative;display:block;width:100%;aspect-ratio:2/3;border-radius:.2em;overflow:hidden;
  transition:transform .17s ease,box-shadow .17s ease,opacity .17s}
.poster::after{content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(transparent 46%,rgba(0,0,0,.55))}
.pt{position:absolute;inset:auto .5em .5em .5em;z-index:2;font-weight:700;font-size:.8em;
  line-height:1.07;letter-spacing:-.02em;text-transform:uppercase;color:#fff;opacity:.75;
  text-shadow:0 2px 12px rgba(0,0,0,.85);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cm{display:block;margin-top:.55em;font-size:.82em;line-height:1.35;min-width:0;text-align:center;padding:0 .2em}
.cm .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cm .yr{display:block;font-size:.92em;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.m-desktop .card:hover .poster{transform:scale(1.045);box-shadow:0 .7em 1.5em -.4em #000}

/* stock indicators, top-right (card.scss .cardIndicators) */
.ind{position:absolute;top:.3em;right:.3em;z-index:5;display:flex;gap:.15em}
.ind .p{box-sizing:border-box;min-width:1.7em;height:1.7em;padding:0 .4em;border-radius:1em;background:var(--jf);
  color:#fff;font-size:.7em;font-weight:600;display:grid;place-items:center}
.ind .p svg{width:.9em;height:.9em}

/* file mark, top-left — Rule 3 */
.mk{position:absolute;top:.3em;left:.3em;z-index:5;display:inline-flex;align-items:center;gap:.28em;
  height:1.4em;padding:0 .32em;border-radius:.9em;font-family:var(--m);font-size:.66em;
  background:rgba(6,6,6,.6);backdrop-filter:blur(3px)}
.mk svg{width:1.05em;height:1.05em;display:block}
.mk.have{color:rgba(255,255,255,.4);background:none;backdrop-filter:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
.mk.none,.mk.arch{color:#cfa8dd}
.mk.act{color:#f0dbf7}
.ring{width:.95em;height:.95em;border-radius:50%;flex:none;
  background:conic-gradient(var(--mod) calc(var(--p)*1%),rgba(255,255,255,.22) 0);
  -webkit-mask:radial-gradient(circle,transparent 43%,#000 46%);mask:radial-gradient(circle,transparent 43%,#000 46%)}
.card[data-f="none"] .poster{opacity:.6}
.card[data-f="none"] .cm .nm{color:var(--ink2)}
body.m-desktop .card[data-f="none"]:hover .poster{opacity:.85}
.due{position:absolute;left:.3em;top:.3em;z-index:6;font-family:var(--m);font-size:.64em;
  padding:.1em .4em;border-radius:.2em;background:rgba(20,15,5,.85);color:#f0cd8a;
  border:1px solid rgba(224,163,62,.45)}
.due.crit{background:rgba(24,10,8,.85);color:#f3a49e;border-color:rgba(224,90,82,.45)}

/* desktop hover menu / mobile overlay buttons — both upstream, both kept */
.hov{position:absolute;inset:0;z-index:6;display:none}
body.m-desktop .card:hover .hov{display:block}
.hov .mid{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:3.4em;height:3.4em;border-radius:50%;background:rgba(0,164,220,.42);
  display:grid;place-items:center}
.hov .mid svg{width:1.7em;height:1.7em;color:var(--jf);margin-left:.12em}
.hov .tip{position:absolute;left:50%;top:64%;transform:translateX(-50%);background:#3a3a3a;
  color:#fff;font-size:.72em;padding:.25em .6em;border-radius:.15em;white-space:nowrap}
.hov .btm{position:absolute;right:.7em;bottom:.55em;display:flex;gap:.9em;align-items:center}
.hov .btm svg{width:1.35em;height:1.35em;color:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.ovl{position:absolute;right:.3em;bottom:.3em;z-index:6;display:none;gap:.3em}
body.m-tablet .ovl,body.m-mobile .ovl{display:flex}
.ovl .b{width:2em;height:2em;border-radius:50%;background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.34);display:grid;place-items:center}
.ovl .b svg{width:1em;height:1em}

/* tv focus */
body.m-tv .card.foc .poster{transform:scale(1.09);box-shadow:0 0 0 .16em var(--jf),0 1em 2em -.4em #000}
body.m-tv .card.foc .cm .nm{color:#fff;font-weight:600}
body.m-tv .card:hover .poster{transform:none;box-shadow:none}
body.m-tv .foc.tab,body.m-tv .foc.tb2,body.m-tv .foc.btn,body.m-tv .foc.nb,body.m-tv .foc.hline,
body.m-tv .foc.rel,body.m-tv .foc.qrow,body.m-tv .foc.mi{box-shadow:0 0 0 .15em var(--jf);border-radius:.25em}

/* ---------- hero billboard — what makes an overlaying bar work ---------- */
.hero{position:relative;height:26em;display:flex;align-items:flex-end;padding:0 1.6em 1.4em;overflow:hidden}
body.m-mobile .hero{height:22em;padding:0 1em 1em}
body.m-tv .hero{height:28em}
.hero .art2{position:absolute;inset:-5%;overflow:hidden;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.hero .prev{position:absolute;right:1.6em;bottom:1.5em;z-index:3;display:flex;align-items:center;gap:.7em;
  font-family:var(--m);font-size:.66em;letter-spacing:.11em;color:var(--ink2)}
.hero .prev .dot2{width:.5em;height:.5em;border-radius:50%;background:var(--jf);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.hero .prev .mute{width:2.3em;height:2.3em;border-radius:50%;border:1px solid rgba(255,255,255,.45);
  display:grid;place-items:center;color:#fff}
.hero .prev .mute svg{width:1.1em;height:1.1em}
.hero::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(16,16,16,.95) 0%,rgba(16,16,16,.6) 44%,transparent 74%),
             linear-gradient(0deg,var(--bg) 1%,transparent 46%)}
.hero .in2{position:relative;z-index:2;max-width:34em}
.hero h1{margin:0 0 .35em;font-size:2.6em;font-weight:700;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
body.m-mobile .hero h1{font-size:1.9em}
.hero .meta2{display:flex;align-items:center;gap:.55em;font-size:.85em;color:var(--ink2);
  margin-bottom:.6em;flex-wrap:wrap}
.hero .meta2 .mk{position:static;background:rgba(255,255,255,.12)}
.hero p{margin:0 0 1em;font-size:.9em;line-height:1.55;color:#d2d2d2;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
body.m-mobile .hero p{display:none}
.hero .hb{display:flex;gap:.6em;flex-wrap:wrap}
.hero .hb .btn{padding:.72em 1.5em;font-size:.92em}
.hero .hb .btn.w{background:#fff;color:#111}
.hero .hb .btn.w:hover{background:#e6e6e6}
.hero .hb .btn.g{background:rgba(109,109,110,.72);color:#fff}
.hero .hb .btn.g:hover{background:rgba(109,109,110,.5)}

/* ---------- home rows ---------- */
.sec{padding:1.5em .95em .55em;display:flex;align-items:center;gap:.55em}
.sec h2{margin:0;font-size:1.5em;font-weight:400;letter-spacing:-.005em;line-height:1.2}
.sec .cv2{font-size:1.15em;color:var(--ink2);margin-left:-.2em}
.sec .why{font-family:var(--m);font-size:.62em;color:var(--mod);letter-spacing:.05em;
  border:1px solid rgba(170,92,195,.4);border-radius:1em;padding:.15em .6em;align-self:center}
.sec .arrows{margin-left:auto;display:flex;gap:.15em}
.sec .arrows button{width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.sec .arrows button:hover{background:#ffffff12;color:var(--ink)}
.sec .arrows svg{width:1.3em;height:1.3em}
.row{display:flex;gap:.85em;padding:0 .95em .6em;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
body.m-tv .row{padding-top:1.5em;margin-top:-1.2em;padding-bottom:1.5em;margin-bottom:-1.2em}
.row .card{flex:none}
.wide{width:19em}
body.m-tablet .wide{width:15em}
body.m-mobile .wide{width:12.5em}
body.m-tv .wide{width:21em}
.wide .poster{aspect-ratio:16/9}
.wide .pt{display:none}
.wide .pt{font-size:.86em}
.pg{position:absolute;left:0;right:0;bottom:0;height:.22em;background:rgba(255,255,255,.22);z-index:3}
.pg i{display:block;height:100%;background:var(--jf)}
.narrow{width:9.2em}
body.m-tablet .narrow{width:8.2em}
body.m-mobile .narrow{width:6.8em}
body.m-tv .narrow{width:11em}

/* ---------- search ---------- */
.sw{padding:1em .95em 0}
.sf{display:flex;align-items:center;gap:.7em;background:#1a1a1a;border:1px solid var(--line);
  border-radius:.3em;padding:0 .9em;height:3em}
.sf:focus-within{border-color:var(--jf)}
.sf svg{width:1.2em;height:1.2em;color:var(--ink3);flex:none}
.sf input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);
  font-size:1em;font-family:var(--f)}
.sf input::placeholder{color:var(--ink3)}
.ssec{padding:1.2em .95em .55em;display:flex;align-items:baseline;gap:.6em}
.ssec h3{margin:0;font-size:.95em;font-weight:600}
.ssec .sub{font-family:var(--m);font-size:.68em;color:var(--ink3)}
.ssec.left h3{color:#e3c6ee}
.plus{position:absolute;right:.35em;bottom:.35em;z-index:7;width:1.9em;height:1.9em;border-radius:50%;
  background:var(--mod);color:#fff;display:grid;place-items:center;box-shadow:0 .2em .6em -.1em #000c}
.plus:hover{transform:scale(1.12)}
.plus svg{width:1.1em;height:1.1em}
.sk{border-radius:.2em;background:linear-gradient(100deg,#1d1d1d 30%,#292929 50%,#1d1d1d 70%);
  background-size:220% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
.note{margin:.4em .95em 0;padding:.6em .8em;border:1px dashed var(--line);border-radius:.3em;
  font-size:.78em;color:var(--ink3)}

/* ---------- buttons (upstream: .mainDetailButtons is flex, align-items center) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.55em 1.1em;border-radius:.25em;font-size:.85em;font-weight:600;line-height:1.2;
  background:#2e2e2e;color:var(--ink);white-space:nowrap}
.btn:hover{background:#3a3a3a}
.btn svg{width:1.1em;height:1.1em;flex:none;display:block}
.btn.pri{background:var(--jf);color:#04222c}
.btn.pri:hover{background:#1eb6e8}
.btn.mod{background:var(--mod);color:#fff}
.btn.mod:hover{background:#b96fd2}
.btn.rnd{width:2.5em;height:2.5em;padding:0;border-radius:50%}

/* ---------- CSS-drawn artwork: no image files, deterministic per title ---------- */
.poster,.th2,.th3,.ph,.qp,.still,.art2,.art3,.dp{container-type:inline-size}
.pa{position:absolute;inset:0;overflow:hidden;z-index:2;pointer-events:none}
.pa::before{content:'';position:absolute;inset:-40%;pointer-events:none;opacity:.45;
  background:repeating-linear-gradient(112deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}
.pa::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 88% at 50% 28%,transparent 48%,rgba(0,0,0,.38) 100%)}
.pa-t{position:absolute;left:8%;right:8%;z-index:2;color:#fff;
  text-shadow:0 .06em .5em rgba(0,0,0,.55)}

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
const raw=(tpl,e)=>tpl.replace(/%T%/g,e.t.replace(/[^A-Za-z0-9]+/g,'.').replace(/^\.|\.$/g,'')).replace(/%Y%/g,e.y);

const VAR=['a','b','c'];
const CREDIT=['A FILM BY','ORIGINAL SERIES','IN CINEMAS','A TRUE STORY','FROM THE DIRECTOR OF'];
/** Cover art, CSS only: layered gradients as a background image. */
function art(t){
  const a=hash(t)%360,b=(a+42+hash(t+'x')%70)%360;
  return `background-image:radial-gradient(74% 56% at ${18+hash(t+'p')%62}% ${12+hash(t+'r')%50}%,hsla(${a},82%,62%,.6) 0,transparent 64%),`
   +`radial-gradient(64% 50% at ${20+hash(t+'q')%60}% 82%,hsla(${b},72%,54%,.46) 0,transparent 62%),`
   +`linear-gradient(${135+hash(t)%80}deg,hsl(${a},48%,34%) 0,hsl(${b},56%,14%) 100%)`;
}
/** Poster typography drawn in HTML — the "printed" layer over the art. */
function artType(t){
  const v=VAR[hash(t+'v')%3];
  let big=t, small='';
  if(t.includes(':')) [big,small]=t.split(':');
  else if(t.split(' ').length>2){const w=t.split(' ');big=w.slice(0,2).join(' ');small=w.slice(2).join(' ');}
  big=big.trim(); small=small.trim();
  const L=Math.max(...big.split(' ').map(w=>w.length),1);
  const fs=v==='c'?Math.min(15,150/L):Math.min(23,190/L);
  const si=v==='c'?Math.min(4.6,60/Math.max(small.length,1)):Math.min(9,110/Math.max(small.length,1));
  return `<span class="pa ${v}" style="--fs:${fs.toFixed(1)}cqw;--si:${si.toFixed(1)}cqw">
    <span class="pa-t"><b>${big}</b>${small?`<i>${small}</i>`:''}`
    +`<u>${CREDIT[hash(t+'c')%CREDIT.length]}</u></span></span>`;
}

function pass(e){
  const f=S.filt, fileOn=f.have||f.none||f.dl||f.arch;
  if(fileOn){
    const ok=(f.have&&e.f==='have')||(f.none&&(e.f==='none'||e.f==='seek'))||
             (f.dl&&(e.f==='dl'||e.f==='grab'))||(f.arch&&e.f==='arch');
    if(!ok)return false;
  }
  if(f.played&&!e.pl)return false;
  if(f.unplayed&&e.pl)return false;
  if(f.due&&!(e.due!=null&&e.due<=7&&!S.kept.has(e.id)))return false;
  return true;
}

/* ===================== pieces ===================== */
/** Every source's score, with its own mark, in one row — replaces the bare star
 *  and the separate IMDb/TMDB/Trakt link line. Each chip is the link. */
function ratings(e){
  const r=e.rate, h=hash(e.t);
  const tm=Math.min(97,Math.round(r*10+ (h%9) - 4));
  const tk=Math.min(98,Math.round(r*10+ (h%13) - 6));
  const gg=Math.min(99,Math.round(r*10+ (h%7) + 2));
  const one=(cls,ic,val,src,href)=>
    `<a class="rt ${cls}" href="${href}" target="_blank" rel="noopener noreferrer" title="${src}">
      ${ic}<b>${val}</b><span class="src">${src}</span></a>`;
  const q=encodeURIComponent(e.t+' '+e.y);
  return one('imdb',I.star,r.toFixed(1),'IMDb',`https://www.imdb.com/find/?q=${q}`)
   +one('tmdb',I.disc2,tm+'%','TMDB',`https://www.themoviedb.org/search?query=${q}`)
   +one('trakt',I.ring2,tk+'%','Trakt',`https://trakt.tv/search?query=${q}`)
   +one('goog',I.gg,gg+'%','Google',`https://www.google.com/search?q=${q}`);
}

function coverMarks(e,big){
  const m=e.f==='dl'
    ? `<span class="mk act" title="downloading"><i class="ring" style="--p:${e.p}"></i>${e.p}%</span>`
    : (()=>{const k=MARK[e.f];return `<span class="mk ${k[0]}" title="${k[2]}">${k[1]}</span>`})();
  const showDue=e.due!=null&&!S.kept.has(e.id)&&(big||e.due<=3||S.filt.due);
  return showDue?`<span class="due ${e.due<=2?'crit':''}">${e.due}d left</span>`:m;
}

  const marks=coverMarks(e);
  const ind=e.pl?`<span class="ind"><span class="p">${I.tick}</span></span>`
    :e.un?`<span class="ind"><span class="p">${e.un}</span></span>`:'';
  return `<button class="card ${cls||''}" data-e="${e.id}" data-f="${e.f}" data-nav>
    <span class="poster" style="${art(e.t)}">${cls==='wide'?'':artType(e.t)}${marks}${ind}
      <span class="hov"><span class="mid">${I.play}</span><span class="tip">Play</span>
        <span class="btm">${I.tick}${I.heart}${I.more}</span></span>
      <span class="ovl"><span class="b">${I.play}</span><span class="b">${I.more}</span></span>
      ${e.res?`<span class="pg"><i style="width:${e.res*22}%"></i></span>`:''}

function vSearch(){

  const held=new Set(E.map(e=>e.t.toLowerCase()));
  const left=q.length>=2?TM.filter(x=>hit(x)&&!held.has(x.t.toLowerCase())):[];
  let b='';
  if(!q){
    b=`<div class="ssec"><h3>Suggestions</h3><span class="sub">upstream SearchSuggestions, unchanged</span></div>
       <div class="grid" style="padding-top:0">${E.slice(0,S.mode==='mobile'?6:8).map(e=>card(e)).join('')}</div>`;
  }else{
    const sec=(t,sub,items,tm)=>`<div class="ssec ${tm?'left':''}"><h3>${t}</h3><span class="sub">${sub}</span></div>`
      +(items.length?`<div class="grid" style="padding-top:0">${items.map(x=>tm?tmdbCard(x):card(x)).join('')}</div>`
        :`<div class="note">No match.</div>`);
    b=sec('Movies','upstream heading — file or no file, sorted together',mv)
     +sec('Shows','upstream heading',sh)
     +`<div class="ssec"><h3>Episodes · People · Studios · Collections</h3><span class="sub">upstream sections, unchanged</span></div>

     +(S.tmdbWait
        ? `<div class="ssec left"><h3>Add from TMDB</h3><span class="sub">reserved slot — nothing above it moves</span></div>
           <div class="grid" style="padding-top:0">${Array.from({length:S.mode==='mobile'?3:6}).map(()=>
             `<div><div class="sk" style="aspect-ratio:2/3"></div><div class="sk" style="height:.8em;margin-top:.5em;width:70%"></div></div>`).join('')}</div>`
        : sec('Add from TMDB','not in your library — everything you already have is excluded',left,true));
    if(!mv.length&&!sh.length&&!left.length&&!S.tmdbWait)
      b+=`<div class="note" style="margin-top:1em">Nothing anywhere for “${S.q}”.</div>`;

function vEntry(){
  const e=E.find(x=>x.id===S.ent); if(!e)return vMovies();
  const has=e.f==='have', arch=e.f==='arch', act=['dl','grab','seek'].includes(e.f), none=e.f==='none';
  const kept=S.kept.has(e.id), isEp=e.k==='series';
  const rt=e.rt?`${Math.floor(e.rt/60)}h ${e.rt%60}m`:'58m';
  const ends=new Date(Date.now()+(e.rt||58)*60000)
    .toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});

  const hist = arch
    ? [['4 Mar 2024',`Grabbed <code>${e.q} WEB-DL</code> from HDBits`],
       ['4 Mar 2024','Imported by hardlink · seeded to ratio 1.4'],['9 Mar 2024','Watched'],
       [e.rem,`File removed · <b>${e.sz} GB</b> reclaimed · placeholder kept`]]
    : none ? [['12 Aug','Added from TMDB search'],['12 Aug','Quality profile <code>1080p</code>'],
              ['2h ago','Searched 6 indexers · 0 releases passed the profile']]
    : act ? [['3 days ago','Added'],['1h ago',`Grabbed <code>${e.q||'1080p'} BluRay x265</code> from HDBits`],
             ['now',`Downloading · ${e.p||0}%`]]
    : [['12 Aug 2024','Grabbed <code>'+(e.q||'1080p')+'</code> from HDBits'],
       ['12 Aug 2024','Imported by hardlink'],...(e.pl?[['later','Watched']]:[])];
  const summary = arch?`Watched ${e.w} <span class="dim">· file removed ${e.rem}</span>`
    : e.pl?`Watched <span class="dim">· added 12 Aug 2024</span>`
    : none?`Added 12 Aug <span class="dim">· last searched 2h ago</span>`
    : act?`Added 3 days ago <span class="dim">· ${e.f==='dl'?'downloading':'queued'}</span>`
    : `Added 12 Aug 2024 <span class="dim">· never watched</span>`;

  // upstream's own metadata rows, then ours
  const rows=[];
  if(has||arch){
    rows.push(['Video', arch
      ? `<span style="color:var(--ink2)">Placeholder — no media file</span>`
      : `Release for toloka.to · ${e.q} · ${e.q==='2160p'?'HEVC':'H264'} · SDR`]);
    if(!arch){
      rows.push(['Audio',`<select class="selbox"><option>Original — English — DTS-HD MA 5.1</option>
        <option>English — AC3 2.0</option><option>Commentary — AAC 2.0</option></select>`]);
      rows.push(['Subtitles',`<select class="selbox"><option>Off</option>
        <option>Full — English — SUBRIP</option><option>Full — Ukrainian — SUBRIP</option></select>`]);
    }
  }

  const meta = `
    ${rows.map(r=>`<div class="mrow"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}
    ${(has||arch)?'':''}
    ${(has&&!isEp)?`<p class="tagline">A whole new world of adventure — one house at a time.</p>`:''}
    <p class="ov3">${
      none?'Nothing on disk, and nothing coming yet. The entry is real; the file is not. Monitored entries are searched on a schedule until a release passes the quality profile.'
      :act?'A release passed the profile and went to the download client. When it completes it is hardlinked into the library and this entry picks up its media info — the Video, Audio and Subtitle rows above appear then.'
      :arch?'You watched this, and the file has since been reclaimed. What remains is a 100-byte placeholder — enough for Jellyfin to keep the item, the artwork and the played state on every client.'
      :'In turn of the century London, a magical nanny employs music and adventure to help two neglected children become closer to their father.'}</p>
    <p class="tag3"><span class="k">Tags:</span> <b>1910s, based on novel or book, chimney sweep, family,
      governess, london england, magic, musical, nanny, umbrella</b></p>
    <div class="mrow gap"><span class="k">Director</span><span class="v"><b>Robert Stevenson</b></span></div>
    <div class="mrow"><span class="k">Writers</span><span class="v"><b>Don DaGradi, Bill Walsh</b></span></div>
    <div class="mrow"><span class="k">Studio</span><span class="v"><b>Walt Disney Productions</b></span></div>
    <div class="mrow"><span class="k">Genres</span><span class="v"><b>${e.gen}</b></span></div>
    <div class="mrow"><span class="k">History</span><span class="v">
      <button class="hline" aria-expanded="${S.hist}" data-hist data-nav><span class="cv">›</span>${summary}</button>
      ${S.hist?`<div class="hbody">${hist.map(h=>`<div class="hr"><time>${h[0]}</time><span>${h[1]}</span></div>`).join('')}</div>`:''}
    </span></div>`;

  const acts = `
    ${has?`<button class="ab" title="Play" data-nav>${I.play}</button>`:''}
    ${has&&e.res?`<button class="ab" title="Resume" data-nav>${I.replay}</button>`:''}
    ${(none||arch||e.f==='seek')
      ? `<button class="textb" data-rel data-nav>${I.srch}${arch?'Get again':'Search releases'}</button>`
      : `<button class="ab mod" title="Search releases" data-rel data-nav>${I.srch}</button>`}
    ${has?`<button class="ab" title="Versions" data-nav>${I.vers}</button>`:''}
    <button class="ab" title="Mark played" data-nav>${I.tick}</button>
    <button class="ab" title="Favourite" data-nav>${I.heart}</button>
    <button class="ab" title="More" data-nav>${I.more}</button>`;

  const cast=['Julie Andrews|Mary Poppins','Dick Van Dyke|Bert','David Tomlinson|Mr. Banks',
    'Glynis Johns|Mrs. Banks','Hermione Baddeley|Ellen','Karen Dotrice|Jane Banks',
    'Matthew Garber|Michael Banks','Elsa Lanchester|Katie Nanna','Arthur Treacher|Constable'];

  return bar()+`<div class="body" id="scrollbody"><div class="det">
    <div class="bd"><div class="art3" style="${art(e.t)}"></div>
      <div class="logotitle">${e.t}</div></div>

    <div class="still ${isEp?'':'poster2'}" style="${art(e.t)}">${isEp?'':artType(e.t)}${coverMarks(e,true)}
      ${(has&&e.res)?`<span class="pg"><i style="width:${e.res*22}%"></i></span>`:''}</div>

    <div class="band">
      <div class="bandinfo">
        <div class="s1">${e.t}</div>
        ${isEp?`<div class="s2">Season 3 · 2. Episode 2</div>`:''}
        <div class="s3"><span>${e.y}</span><span>${rt}</span>
          ${isEp?'':'<span class="chipG">PG</span>'}
          <span class="rates">${ratings(e)}</span>
          ${has?`<span>Ends at ${ends}</span>`:''}</div>
      </div>
      <div class="bandacts">${acts}</div>
    </div>

    <div class="meta3 ${isEp?'ep':''}">${meta}</div>

    ${isEp?`<div class="dsec"><h3>More from Season 3
        <span class="arrows"><button>${I.chevL}</button><button>${I.chevR}</button></span></h3>
      <div class="hrow">${[1,2,3,4,5,6].map(n=>`<div class="epc">
        <div class="th2" style="${art(e.t+n)}">${n===1?`<span class="ind"><span class="p">${I.tick}</span></span>`:''}
          ${n===2?'<span class="pg"><i style="width:38%"></i></span>':''}</div>
        <div class="cap">${n}. Episode ${n}</div></div>`).join('')}</div></div>`:''}

    <div class="dsec"><h3>Cast &amp; Crew
      <span class="arrows"><button>${I.chevL}</button><button>${I.chevR}</button></span></h3>
      <div class="hrow">${cast.map(c=>{const [n,r]=c.split('|');
        return `<div class="pers"><div class="ph" style="${art(n)}"></div><b>${n}</b><span>as ${r}</span></div>`}).join('')}</div></div>

    <div class="dsec"><h3>Scenes
      <span class="arrows"><button>${I.chevL}</button><button>${I.chevR}</button></span></h3>
      <div class="hrow">${['0:00','5:54','8:56','12:37','18:36','22:57','31:39'].map((tm,n)=>
        `<div class="chp"><div class="th3" style="${art(e.t+'c'+n)}"></div>
          <span class="lab">Chapter ${String(n+1).padStart(2,'0')}<i>${tm}</i></span></div>`).join('')}</div></div>

    <div class="dsec"><h3>More Like This</h3>
      <div class="hrow">${E.filter(x=>x.id!==e.id).slice(0,9).map(x=>card(x,'narrow')).join('')}</div></div>

    <div class="dsec"><div class="note" style="margin:0 0 2em">Everything on this page is upstream's — the backdrop and
      logo, the info band and its buttons, the Video / Audio / Subtitles rows, tags, links, crew, Cast &amp; Crew,
      Scenes, More Like This. JellyfinMod adds exactly two things: <b>Search releases</b> in the button row, and a
      <b>History</b> row in the metadata block. On an entry with no file, the media rows simply have nothing to
      describe — which is what "no file yet" looks like without inventing a badge for it.</div></div>
  </div></div>`;
}

  const due=e.due!=null&&!S.kept.has(e.id);
  return `<button class="mi plain modItem" data-rel data-ectx="${e.id}">${I.srch}${e.f==='arch'?'Get again':'Search releases'}</button>`
    +(due?`<button class="mi plain modItem" data-keep="${e.id}">${I.shield}Keep — never reclaim</button>`:'')
    +`<button class="mi plain modItem">${I.trash}Remove entry</button>`;
}
function itemMenu(e){
  const playable=e.f==='have';
  const groups={g1:[],g2:[],g3:[]};
  MENU_ITEMS.forEach(([ic,l,g])=>{ if(!playable&&NEEDS_FILE.includes(l))return;
    groups[g].push(`<button class="mi plain">${I[ic]||I.info}${l}</button>`); });
  return [groups.g1.join(''),modGroup(e),groups.g2.join(''),groups.g3.join('')]
    .filter(Boolean).join('<div class="msep"></div>');
}
let menuEl=null;
function openMenu(x,y,id){
  closeMenu();
  const e=E.find(i=>i.id===id); if(!e)return;
  menuEl=document.createElement('div');
  menuEl.className='menu'; menuEl.style.position='fixed';
  menuEl.innerHTML=itemMenu(e);
  document.body.appendChild(menuEl);
  const w=menuEl.offsetWidth,h=menuEl.offsetHeight;
  menuEl.style.left=Math.min(x,innerWidth-w-8)+'px';
  menuEl.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+'px';
  menuEl.addEventListener('click',ev=>{
    const rel=ev.target.closest('[data-rel]'), kp=ev.target.closest('[data-keep]');
    closeMenu();
    if(rel){S.dlg=rel.dataset.ectx||id;render();}
    else if(kp){S.kept.add(kp.dataset.keep);render();
      snack('Kept indefinitely — retention will not touch this file.','Undo',
        ()=>{S.kept.delete(kp.dataset.keep);render()});}
  });
}
function closeMenu(){ if(menuEl){menuEl.remove();menuEl=null;} }
document.addEventListener('contextmenu',ev=>{
  const c=ev.target.closest('.card[data-e]');
  if(c){ev.preventDefault();openMenu(ev.clientX,ev.clientY,c.dataset.e);}});
document.addEventListener('mousedown',ev=>{ if(!ev.target.closest('.menu'))closeMenu(); },true);

/* ===================== render ===================== */
const V={home:vHome,movies:vMovies,search:vSearch,entry:vEntry,queue:vQueue};
function render(keepFocus){
  document.body.className='m-'+S.mode;
  scr.dataset.mode=({desktop:'',tablet:'TABLET · 1024×768 · layout-mobile at desktop width · root 14.4px',
    mobile:'MOBILE · 390×844 · layout-mobile · root 14.4px · drawer below md',
    tv:'webOS TV · 1920×1080 · layout-tv · root 20px (125%) · arrows + Enter + Backspace'})[S.mode];
  scr.innerHTML=(V[S.route]||vHome)()+drawer()+dialog()
    +'<div id="snack"><span class="t"></span><button id="sact"></button></div>';
  fit();
  if(S.route==='search'){const i=$('#q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);
    i.addEventListener('input',onType);}}
  const sb=document.getElementById('scrollbody');
  if(sb){sb.addEventListener('scroll',()=>{
    document.body.classList.toggle('scrolled',sb.scrollTop>40);},{passive:true});
    document.body.classList.toggle('scrolled',sb.scrollTop>40);}
  else document.body.classList.add('scrolled');
  if(S.mode==='tv')navRefresh(keepFocus);
  $('#hint').textContent=({home:'rows are merged — see the purple tags',movies:'open Filter ▾ → File',
    search:'type, then press + on a TMDB card',entry:'click the history line',queue:'poll every 3s'})[S.route]||'';
}
function fit(){
  const st=$('#stage'), fr=$('#frame');
  if(S.mode==='desktop'){scr.style.transform='';fr.style.width='';fr.style.height='';return;}
  const D={tablet:[1024,768],mobile:[390,844],tv:[1920,1080]}[S.mode];
  const w=st.clientWidth-44,h=st.clientHeight-108;
  const s=Math.min(1,w/D[0],h/D[1]);
  scr.style.transform='scale('+s+')';
  fr.style.width=(D[0]*s)+'px';
  fr.style.height=(D[1]*s)+'px';
}
function go(r,id){S.route=r;S.ent=id||S.ent;S.menu=null;S.hist=false;S.drawer=false;
  if(r!=='search')S.q='';render();}

/* ===================== events ===================== */
let localT,tmdbT;
function onType(ev){
  const v=ev.target.value;
  clearTimeout(localT);clearTimeout(tmdbT);
  localT=setTimeout(()=>{S.q=v;S.tmdbWait=v.trim().length>=2;render(true)},250);
  tmdbT=setTimeout(()=>{S.q=v;S.tmdbWait=false;render(true)},900);
}
function snack(msg,label,fn){
  const el=$('#snack');if(!el)return;
  el.querySelector('.t').innerHTML=msg;
  const b=$('#sact');b.textContent=label||'';b.style.display=label?'':'none';
  b.onclick=()=>{el.classList.remove('up');fn&&fn()};
  el.classList.add('up');
  clearTimeout(snack._t);snack._t=setTimeout(()=>el.classList.remove('up'),4600);
}
scr.addEventListener('click',ev=>{
  const t=ev.target;
  const hit=s=>t.closest(s);

  if(hit('[data-drawer]')){S.drawer=true;render();return;}
  if(hit('[data-drawer-close]')){S.drawer=false;render();return;}
  if(hit('[data-scrim]')&&!hit('.dlg')){S.dlg=false;S.rej=false;render();return;}
  if(hit('[data-close]')){S.dlg=false;S.rej=false;render();return;}
  if(hit('[data-rej]')){S.rej=!S.rej;render(true);return;}

  const g=hit('[data-grab]');
  if(g){const r=REL[+g.dataset.grab];const e=E.find(x=>x.id===S.dlg);
    if(e){e.f='dl';e.p=1;e.q=r.q;} S.dlg=false;S.rej=false;render();
    snack(`Grabbed <b>${r.q} ${r.s}</b> to qBittorrent`,'Open queue',()=>go('queue'));return;}

  const rel=hit('[data-rel]');
  if(rel){S.dlg=S.ent||'br2049';S.menu=null;render();return;}

  const goEl=hit('[data-go]');
  if(goEl){go(goEl.dataset.go);return;}

  const mn=hit('[data-menu]');
  if(mn){const k=mn.dataset.menu;S.menu=S.menu===k?null:k;render(true);return;}

  const f=hit('[data-filt]');
  if(f){S.filt[f.dataset.filt]=!S.filt[f.dataset.filt];render(true);return;}
  if(hit('[data-clear]')){Object.keys(S.filt).forEach(k=>S.filt[k]=false);render();return;}

  const k=hit('[data-keep]');
  if(k){const id=k.dataset.keep;S.kept.add(id);S.menu=null;render();
    snack('Kept indefinitely — retention will not touch this file.','Undo',()=>{S.kept.delete(id);render()});return;}

  const rm=hit('[data-qrm]');
  if(rm){const e=E.find(x=>x.id===rm.dataset.qrm);const old={f:e.f,p:e.p};e.f='none';delete e.p;render();
    snack('Removed from the queue · release blocklisted','Undo',()=>{Object.assign(e,old);render()});return;}

  const add=hit('[data-add]');
  if(add){ev.stopPropagation();
    const x=TM.find(i=>i.id===add.dataset.add);
    if(x){E.unshift({...x,f:'none',gen:'Drama',rt:110,rate:6.8});render(true);
      snack(`Added <b>${x.t}</b> · profile 1080p`,'Undo',()=>{E=E.filter(i=>i.id!==x.id);render(true)});
      const i2=$('#q');if(i2){i2.focus();i2.setSelectionRange(i2.value.length,i2.value.length);}}
    return;}

  if(hit('[data-hist]')){S.hist=!S.hist;render(true);return;}

  const eg=hit('[data-e-go]');
  if(eg){go('entry',eg.dataset.eGo);return;}

  const dots=hit('.hov .btm');
  if(dots){const cc=hit('.card[data-e]');
    if(cc){openMenu(ev.clientX,ev.clientY,cc.dataset.e);return;}}

  const c=hit('.card[data-e]');
  if(c&&!hit('[data-add]')){go('entry',c.dataset.e);return;}

  if(S.menu&&!hit('.menu')){S.menu=null;render(true);}
});

document.querySelectorAll('#scr [data-r]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#scr button').forEach(x=>x.classList.toggle('on',x===b));
  go(b.dataset.r);}));
document.querySelectorAll('#mode [data-m]').forEach(b=>b.addEventListener('click',()=>{
  S.mode=b.dataset.m;
  document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));
  render();}));
window.addEventListener('resize',fit);

/* ---------- D-pad (tv only) ---------- */
let NE=[],ni=0;
function navRefresh(keep){
  const root=S.dlg?scr.querySelector('.dlg'):scr;
  NE=[...root.querySelectorAll('[data-nav]')].filter(el=>el.offsetParent!==null);
  NE.forEach(el=>el.classList.remove('foc'));
  if(!NE.length)return;
  if(!keep||ni>=NE.length){const c=NE.findIndex(el=>el.classList.contains('card'));ni=c<0?0:c;}
  NE[ni].classList.add('foc');
}
function move(dx,dy){
  if(!NE.length)return;
  const cur=NE[ni].getBoundingClientRect(),cx=cur.left+cur.width/2,cy=cur.top+cur.height/2;
  let best=-1,bs=1e9;
  NE.forEach((el,i)=>{
    if(i===ni)return;
    const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,ddx=x-cx,ddy=y-cy;
    if(dx&&Math.sign(ddx)!==dx)return;
    if(dy&&Math.sign(ddy)!==dy)return;
    if(dx&&Math.abs(ddy)>Math.max(cur.height,r.height)*.8)return;
    if(dy&&Math.abs(ddx)>Math.max(cur.width,r.width)*1.7)return;
    const s=dx?Math.abs(ddx)+Math.abs(ddy)*3:Math.abs(ddy)+Math.abs(ddx)*1.4;
    if(s<bs){bs=s;best=i}
  });
  if(best<0)return;
  NE[ni].classList.remove('foc');ni=best;NE[ni].classList.add('foc');
  NE[ni].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
}
document.addEventListener('keydown',ev=>{
  if(S.mode!=='tv')return;
  const inInput=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(inInput&&!['ArrowUp','ArrowDown','Escape','Backspace'].includes(ev.key))return;
  const M={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(M[ev.key]){ev.preventDefault();move(...M[ev.key]);return;}
  if(ev.key==='Enter'&&NE[ni]){ev.preventDefault();NE[ni].click();return;}
  if(ev.key==='Backspace'||ev.key==='Escape'){ev.preventDefault();
    if(S.dlg){S.dlg=false;render();}else if(S.route==='entry'){go('movies');}else{go('home');}}
});

/* ---------- queue ticks, like a 3s poll ---------- */
setInterval(()=>{
  let ch=false;
  E.forEach(e=>{if(e.f==='dl'&&e.p<100){e.p=Math.min(100,e.p+1);ch=true;}});
  if(ch&&(S.route==='queue'||S.route==='movies'||S.route==='home'))render(true);
},3000);

render();
</script>
