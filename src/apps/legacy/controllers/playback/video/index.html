<div id="videoOsdPage" data-role="page" class="page libraryPage" data-backbutton="true">
    <div class="syncPlayContainer">
        <div id="syncPlayIcon" class="syncPlayIconCircle">
            <span class="primary-icon material-icons play" aria-hidden="true"></span>
            <span class="secondary-icon material-icons play" aria-hidden="true"></span>
        </div>
    </div>
    <div class="upNextContainer upnext hide"></div>
    <div class="player jfmod-dsOsd">
    <div class="videoOsdBottom videoOsdBottom-maincontrols low">
        <div class="osdControls">
            <h1 class="jfmod-osdName"></h1>
            <div class="sub"><span class="jfmod-osdFacts"></span><span class="osdTimeText"><span class="endsAtText"></span></span></div>
            <div class="osdTextContainer osdMainTextContainer">
                <h3 class="osdTitle"></h3>
                <div class="osdMediaStatus hide">
                    <span class="material-icons animate autorenew" aria-hidden="true"></span>
                    <span>${FetchingData}</span>
                </div>
            </div>

            <div class="osdTextContainer osdSecondaryMediaInfo"></div>

            <div class="tline" dir="ltr">
                <span class="tt startTimeText osdPositionText"></span>
                <span class="track">
                    <span class="sliderContainer">
                        <span class="sliderMarkerContainer"></span>
                        <input type="range" step=".01" min="0" max="100" value="0" is="emby-slider" class="osdPositionSlider" data-slider-keep-progress="true" />
                    </span>
                </span>
                <span class="tt endTimeText osdDurationText"></span>
            </div>

            <div class="ctrls buttons focuscontainer-x">
                <div class="actbar glassy" dir="ltr">
                    <button type="button" class="dbtn btnRecord hide"><span class="material-icons fiber_manual_record" aria-hidden="true"></span></button>
                    <button type="button" class="dbtn btnPreviousTrack hide" title="${PreviousTrack} (Shift+P)" aria-label="${PreviousTrack}" data-ds-i="next"></button>
                    <button type="button" class="dbtn btnPreviousChapter hide" title="${PreviousChapter} (PageDown)" aria-label="${PreviousChapter}"><span class="material-icons undo" aria-hidden="true"></span></button>
                    <button type="button" class="dbtn btnRewind" title="${Rewind} (J)" aria-label="${Rewind}" data-ds-i="rew"></button>
                    <button type="button" class="play round btnPause" data-ds-i="pause play"><span class="material-icons pause" aria-hidden="true"></span></button>
                    <button type="button" class="dbtn btnFastForward" title="${FastForward} (L)" aria-label="${FastForward}" data-ds-i="ff"></button>
                    <button type="button" class="dbtn btnNextChapter hide" title="${NextChapter} (PageUp)" aria-label="${NextChapter}"><span class="material-icons redo" aria-hidden="true"></span></button>
                    <button type="button" class="dbtn btnNextTrack hide" title="${NextTrack} (Shift+N)" aria-label="${NextTrack}" data-ds-i="next"></button>
                </div>

                <div class="actbar glassy short">
                    <button is="emby-ratingbutton" type="button" class="dbtn btnUserRating hide paper-icon-button-light" title="${Rate}"><span class="material-icons favorite" aria-hidden="true"></span></button>
                    <div class="volumeButtons hide-mouse-idle-tv">
                        <button type="button" class="dbtn buttonMute" title="${Mute} (M)" aria-label="${Mute}"><span class="material-icons volume_up" aria-hidden="true"></span></button>
                        <div class="sliderContainer osdVolumeSliderContainer">
                            <input is="emby-slider" type="range" step="1" min="0" max="100" value="0" class="osdVolumeSlider" />
                        </div>
                    </div>
                    <button type="button" class="dbtn btnAudio hide" title="${Audio}" data-ds-i="audio"></button>
                    <button type="button" class="dbtn btnSubtitles hide" title="${Subtitles}" data-ds-i="subs"></button>
                    <button type="button" class="dbtn btnVideoOsdSettings" title="${Settings}" data-ds-i="gear"></button>
                    <button type="button" class="dbtn btnAirPlay hide" title="${AirPlay}"><span class="material-icons airplay" aria-hidden="true"></span></button>
                    <button type="button" class="dbtn btnPip hide" title="${PictureInPicture}" data-ds-i="pip"></button>
                    <button type="button" class="dbtn btnFullscreen hide" title="${Fullscreen} (F)" aria-label="${Fullscreen}" data-ds-i="full"><span class="material-icons fullscreen" aria-hidden="true"></span></button>
                </div>
            </div>
        </div>
    </div>
    </div>
</div>
